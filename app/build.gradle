plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.zhimkontrol.app'
    compileSdk 34

    defaultConfig {
        applicationId "ru.zhimkontrol.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Align all Kotlin stdlib modules to one version (fixes duplicate-class error
    // between kotlin-stdlib 1.8.x and legacy kotlin-stdlib-jdk7/jdk8 pulled transitively).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
